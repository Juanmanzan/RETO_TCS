<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nueva transferencia</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="container py-5">
    <div class="d-flex justify-content-between align-items-start mb-4">
      <div>
        <h1 class="h2 fw-bold mb-2">Nueva transferencia</h1>
      </div>
    </div>

    <div class="row g-4">
      <!-- formulario principal para generar el contrato de transferencia -->
      <section class="col-lg-8">
        <form id="formTransferencia" class="card border-0 shadow-sm">
          <div class="card-body p-4 p-md-5">
            <h2 class="h5 fw-bold mb-1">Datos de la transferencia</h2>
            <p class="text-secondary small mb-4">Completa los datos para continuar</p>

            <div class="mb-3">
              <label class="form-label fw-semibold" for="cuentaOrigen">Cuenta de origen</label>
              <select id="cuentaOrigen" class="form-select form-select-lg" required></select>
            </div>

            <div class="mb-3">
              <label class="form-label fw-semibold" for="cuentaDestino">Cuenta de destino</label>
              <select id="cuentaDestino" class="form-select form-select-lg" required></select>
            </div>

            <div class="mb-3">
              <label class="form-label fw-semibold" for="descripcion">Descripcion</label>
              <input id="descripcion" class="form-control form-control-lg" maxlength="255" placeholder="Ej. Pago de servicios">
            </div>

            <div class="mb-4">
              <label class="form-label fw-semibold" for="monto">Monto</label>
              <div class="input-group input-group-lg">
                <span class="input-group-text">$</span>
                <input id="monto" class="form-control" type="number" min="0.01" step="0.01" placeholder="0.00" required>
              </div>
            </div>

            <div id="estado" class="alert alert-light border small">Listo para enviar.</div>
            <button class="btn btn-dark btn-lg w-100" type="submit">Enviar transferencia</button>
          </div>
        </form>
      </section>

      <!-- panel donde llegan las recomendaciones publicadas por la ia -->
      <aside class="col-lg-4">
        <section class="ia-card mb-4">
          <div class="d-flex justify-content-between align-items-start mb-4">
            <div class="ia-logo">IA</div>
            <span id="wsEstado" class="badge rounded-pill text-bg-light">conectando</span>
          </div>
          <p class="small mb-2">Tu asistente financiero</p>
          <h2 class="h5 fw-bold mb-3">Recomendaciones</h2>
          <p id="mensajeIa" class="mb-0">Cuando el worker publique una recomendacion, aparecera aqui.</p>
        </section>

        <!-- muestra el json crudo enviado o recibido desde la api -->
        <section class="card border-0 shadow-sm">
          <div class="card-body p-4">
            <h2 class="h6 fw-bold mb-3">Resumen</h2>
            <pre id="resumen" class="json-box mb-0"></pre>
          </div>
        </section>
      </aside>
    </div>
  </main>

  <script src="./app.js"></script>
</body>
</html>
